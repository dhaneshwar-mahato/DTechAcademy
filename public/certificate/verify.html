<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DTech Academy | Certificate Verification</title>

    <link rel="stylesheet" href="verify.css">

</head>

<body>

    <div class="container">

        <div class="header">

            <img src="images/logo.png" alt="DTech Academy Logo" class="logo">

            <h1>DTech Academy</h1>

            <p>Certificate Verification Portal</p>

        </div>

        <div id="status"></div>

        <div class="card" id="certificateCard" style="display:none;">

            <table>

                <tr>
                    <th>Student Name</th>
                    <td id="studentName"></td>
                </tr>

                <tr>
                    <th>Course</th>
                    <td id="courseName"></td>
                </tr>

                <tr>
                    <th>Certificate No.</th>
                    <td id="certificateNo"></td>
                </tr>

                <tr>
                    <th>Project</th>
                    <td id="projectName"></td>
                </tr>

                <tr>
                    <th>Duration</th>
                    <td id="duration"></td>
                </tr>

                <tr>
                    <th>Issue Date</th>
                    <td id="issueDate"></td>
                </tr>

                <tr>
                    <th>Grade</th>
                    <td id="grade"></td>
                </tr>

            </table>

        </div>

    </div>

    <script src="verify.js"></script>

</body>

</html>
